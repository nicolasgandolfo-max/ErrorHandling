<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment declines — implementation</title>
<link rel="stylesheet" href="_ds/f-lix-design-system-f7e7a69b-3215-41c2-a457-b1dfa4aa56e1/styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root { --ill-base: url("_ds/f-lix-design-system-f7e7a69b-3215-41c2-a457-b1dfa4aa56e1/assets/illustrations/"); }
  body { margin: 0; background: #eae6e0; font-family: var(--font-sans); color: #082422; }
  a { color: #10a8a7; text-decoration: none; }
  a:hover { color: #082422; }

  .shell { display: flex; gap: 32px; align-items: flex-start; justify-content: center; padding: 48px 32px; min-height: 100vh; box-sizing: border-box; }

  /* ── Demo rail (not part of the product surface) ── */
  .rail { width: 300px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 48px; }
  .rail h1 { margin: 0; font-family: var(--font-sans); font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .rail p.lede { margin: 0; font-size: 13px; line-height: 1.5; color: #3f5a58; }
  .rail .group-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #877867; }
  .scenarios { display: flex; flex-direction: column; gap: 6px; }
  .scenario { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid #cfcabf; background: #fefcf9; font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: #082422; cursor: pointer; text-align: left; transition: border-color .15s, background .15s; }
  .scenario:hover { border-color: #877867; }
  .scenario[data-active="true"] { border-color: #082422; background: #fff; }
  .scenario .code { flex-shrink: 0; display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: #082422; color: #2bf2f1; font-size: 10px; font-weight: 700; letter-spacing: .06em; }
  .log { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow-y: auto; }
  .log .entry { font-size: 12px; line-height: 1.45; color: #3f5a58; padding: 5px 10px; background: #fefcf9; border-radius: 8px; border: 1px solid #e5e0d8; }
  .log .entry.exit { background: #d4fffe; border-color: #a8fffe; color: #065958; font-weight: 500; }
  .log .entry .st { font-weight: 700; color: #0f8c8b; }

  /* ── Phone frame ── */
  .phone-wrap { display: flex; flex-direction: column; gap: 10px; }
  .phone-state { display: flex; align-items: baseline; gap: 8px; height: 18px; }
  .phone-state .code { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #10a8a7; }
  .phone-state .name { font-size: 14px; font-weight: 600; }
  .phone { width: 390px; height: 760px; background: #fefcf9; border: 1px solid #cfcabf; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; animation: var(--animate-fade-in); }

  /* Shared screen chrome */
  .topbar { height: 48px; display: flex; align-items: center; padding: 0 16px; flex-shrink: 0; gap: 12px; }
  .topbar--end { justify-content: flex-end; }
  .topbar--split { justify-content: space-between; }
  .chip-btn { width: 36px; height: 36px; border-radius: 999px; background: #efebe7; border: none; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #082422; cursor: pointer; padding: 0; transition: background .15s; }
  .chip-btn:hover { background: #ddd9cf; }
  .topbar .title { font-size: 15px; font-weight: 600; }
  .topbar .spacer { width: 36px; }

  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; padding: 32px 24px 0; min-height: 0; }
  .hero h2 { margin: 0; font-family: var(--font-sans); font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
  .hero p { margin: 0; font-size: 16px; line-height: 1.5; color: #3f5a58; text-wrap: pretty; }
  .footer { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 24px; flex-shrink: 0; }

  .method-card { width: 100%; display: flex; align-items: center; gap: 12px; background: #efebe7; border-radius: 16px; padding: 14px 16px; text-align: left; margin-top: 4px; box-sizing: border-box; }
  .method-card--error { background: #fff5ef; }
  .method-card .badge-ic { width: 40px; height: 40px; border-radius: 999px; background: #fefcf9; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #082422; flex-shrink: 0; }
  .method-card--error .badge-ic { color: #a03808; }
  .method-card .m-title { font-size: 15px; font-weight: 600; color: #082422; }
  .method-card .m-sub { font-size: 13px; color: #877867; }
  .method-card--error .m-sub { color: #a03808; }
  .method-card .col { display: flex; flex-direction: column; gap: 2px; }

  /* Picker (S1) */
  .pick-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; border: 1px solid #cfcabf; background: #fefcf9; cursor: pointer; font-family: var(--font-sans); text-align: left; width: 100%; box-sizing: border-box; transition: border-color .15s; }
  .pick-row:hover { border-color: #877867; }
  .pick-row[data-disabled="true"] { background: #efebe7; opacity: .6; cursor: default; pointer-events: none; }
  .pick-row[data-selected="true"] { border: 1.5px solid #082422; padding: 13.5px 15.5px; }
  .pick-row[data-add="true"] { border-style: dashed; }
  .pick-row .badge-ic { width: 40px; height: 40px; border-radius: 999px; background: #efebe7; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; color: #082422; }
  .pick-row[data-disabled="true"] .badge-ic { background: #fefcf9; }
  .pick-row .check { margin-left: auto; width: 22px; height: 22px; border-radius: 999px; background: #2bf2f1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #082422; }

  /* Amount editor (E5) */
  .amount-box { display: flex; align-items: center; gap: 8px; height: 64px; padding: 0 18px; border-radius: 16px; background: #fefcf9; border: 1.5px solid #2bf2f1; box-shadow: 0 0 0 6px rgba(43,242,241,.1); }
  .amount-box--error { border-color: #f26629; box-shadow: none; }
  .amount-box input { border: none; outline: none; background: transparent; font-family: var(--font-sans); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: #082422; width: 100%; min-width: 0; padding: 0; }
  .amount-box--error input { color: #a03808; }
  .amount-box .cur { font-size: 15px; font-weight: 600; color: #877867; margin-left: auto; flex-shrink: 0; }
  .amt-chip { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 999px; background: #efebe7; color: #082422; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; border: none; cursor: pointer; font-family: var(--font-sans); transition: background .15s; }
  .amt-chip:hover { background: #ddd9cf; }
  .amt-chip--rec { background: #082422; color: #fefcf9; }
  .amt-chip--rec:hover { background: #152b2a; }

  /* TBD placeholder (E3-B / E6-B) */
  .tbd-frame { flex: 1; border: 1.5px dashed #cfcabf; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 0 32px; background: repeating-linear-gradient(135deg, #fefcf9, #fefcf9 10px, #f6f2ed 10px, #f6f2ed 20px); }
  .tbd-pill { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; border-radius: 999px; background: #fffce0; color: #665500; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
  .tbd-frame .t-title { font-size: 17px; font-weight: 600; line-height: 1.35; }
  .tbd-frame .t-desc { font-size: 14px; line-height: 1.5; color: #877867; }
  .sim-row { display: flex; gap: 8px; }
  .sim-btn { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid #cfcabf; background: #fefcf9; font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: #082422; cursor: pointer; }
  .sim-btn:hover { border-color: #877867; }

  /* KYC list (E6-A) */
  .kyc-item { display: flex; align-items: center; gap: 12px; }
  .kyc-item .ic { width: 32px; height: 32px; border-radius: 999px; background: #e8f4f3; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #0b6d6b; flex-shrink: 0; }
  .kyc-item span:last-child { font-size: 15px; line-height: 1.4; }

  /* Summary card (E6-C) */
  .summary { width: 100%; display: flex; flex-direction: column; gap: 10px; background: #efebe7; border-radius: 16px; padding: 16px; text-align: left; margin-top: 4px; box-sizing: border-box; }
  .summary .row { display: flex; justify-content: space-between; align-items: baseline; }
  .summary .k { font-size: 14px; color: #877867; }
  .summary .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .ref-pill { display: flex; align-items: center; gap: 8px; background: #efebe7; border-radius: 999px; padding: 8px 14px; margin-top: 4px; }
  .ref-pill .k { font-size: 13px; color: #877867; }
  .ref-pill .v { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }

  .spin-logo { display: inline-flex; animation: spin 1s linear infinite; }

  /* Exit interstitial (demo shell — outside the 13 designed states) */
  .exit-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 36px; text-align: center; background: #f6f2ed; }
  .exit-screen .ic { width: 56px; height: 56px; border-radius: 999px; background: #d4fffe; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #065958; }
  .exit-screen .t { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .exit-screen .d { font-size: 14px; line-height: 1.5; color: #877867; }
  .exit-screen .tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; border: 1px dashed #adaa9e; color: #877867; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="shell">

  <aside class="rail">
    <h1>Payment declines</h1>
    <p class="lede">Implementation of the 13 decline states. Pick a decline scenario — every attempt enters through S2 (classifying), then routes to its experience. Copy never names the payment's purpose and never leaks the decline reason.</p>
    <div>
      <div class="group-label" style="margin-bottom:8px">Decline scenarios</div>
      <div class="scenarios" id="scenarios"></div>
    </div>
    <div>
      <div class="group-label" style="margin-bottom:8px">Event log</div>
      <div class="log" id="log"></div>
    </div>
  </aside>

  <div class="phone-wrap">
    <div class="phone-state"><span class="code" id="state-code"></span><span class="name" id="state-name"></span></div>
    <div class="phone" id="phone"></div>
  </div>

</div>

<script>
(() => {
  const ILL = "_ds/f-lix-design-system-f7e7a69b-3215-41c2-a457-b1dfa4aa56e1/assets/illustrations/";
  const RETRY_CAP = 3;           // attempts with the same method before E1-B
  const CLASSIFY_MIN_MS = 400;   // S2 minimum hold — decline never flashes in
  const CLASSIFY_TIMEOUT_MS = 8000; // capability timeout → E4 (proposed degraded behaviour)

  const fmt = n => "$" + n.toFixed(2);

  // ── Flow context ────────────────────────────────────────────────
  const ctx = {
    scenario: null,
    amount: 600,
    available: 450,
    attempts: 0,        // attempts with the current method (resets on method change — TBD assumption)
    kycStep: 1,
    methods: [
      { id: "visa",  icon: "credit-card", title: "Visa ···· 4242",         sub: "Debit",              failed: true },
      { id: "mc",    icon: "credit-card", title: "Mastercard ···· 8890",   sub: "Debit" },
      { id: "bank",  icon: "bank",        title: "Bank account ···· 1120", sub: "1–2 business days" },
    ],
    method: null,       // current instrument
    selected: null,     // picker selection
  };
  ctx.method = ctx.methods[0];

  const SCENARIOS = [
    { id: "transient", code: "E1", label: "Transient decline (retry)" },
    { id: "hard",      code: "E2", label: "Instrument unavailable" },
    { id: "stepup",    code: "E3", label: "Security step-up" },
    { id: "terminal",  code: "E4", label: "Terminal decision" },
    { id: "amount",    code: "E5-A", label: "Amount declined" },
    { id: "limit",     code: "E5-B", label: "Amount above limit" },
    { id: "kyc",       code: "E6", label: "Verification required" },
    { id: "timeout",   code: "S2", label: "Capability down (8 s → E4)" },
  ];

  // ── Demo shell plumbing ─────────────────────────────────────────
  const phone = document.getElementById("phone");
  const logEl = document.getElementById("log");
  let pendingTimers = [];
  const later = (fn, ms) => pendingTimers.push(setTimeout(fn, ms));
  const clearTimers = () => { pendingTimers.forEach(clearTimeout); pendingTimers = []; };

  function log(msg, isExit) {
    const e = document.createElement("div");
    e.className = "entry" + (isExit ? " exit" : "");
    e.innerHTML = msg;
    logEl.prepend(e);
  }

  function setState(code, name) {
    document.getElementById("state-code").textContent = code;
    document.getElementById("state-name").textContent = name;
  }

  function render(code, name, html) {
    clearTimers();
    setState(code, name);
    log('<span class="st">' + code + "</span> · " + name);
    phone.innerHTML = '<div class="screen">' + html + "</div>";
  }

  // Exits leave this surface (review, home, WhatsApp, Identity deep link).
  // They are outside the 13 designed states, so the demo shows a neutral interstitial.
  function exit(title, desc) {
    clearTimers();
    setState("—", "Outside this surface");
    log("↳ " + title + (desc ? " — " + desc : ""), true);
    phone.innerHTML =
      '<div class="exit-screen">' +
        '<span class="ic"><i class="ph-bold ph-arrow-bend-up-right"></i></span>' +
        '<span class="t">' + title + "</span>" +
        (desc ? '<span class="d">' + desc + "</span>" : "") +
        '<span class="tag">Exit point — not part of this canvas</span>' +
        '<button class="fx-btn fx-btn--secondary fx-btn--sm" onclick="APP.home()">Back to scenarios</button>' +
      "</div>";
  }

  // ── Shared fragments ────────────────────────────────────────────
  const closeBar = () =>
    '<div class="topbar topbar--end"><button class="chip-btn" aria-label="Close" onclick="APP.close()"><i class="ph ph-x"></i></button></div>';

  const ill = (name, w) => '<img src="' + ILL + name + '.svg" width="' + w + '" alt="" style="display:block">';

  const btn = (label, variant, onclick, disabled) =>
    '<button class="fx-btn fx-btn--' + variant + ' fx-btn--lg fx-btn--full" onclick="' + onclick + '"' + (disabled ? " disabled" : "") + ">" + label + "</button>";

  const methodCard = (icon, title, sub, error) =>
    '<div class="method-card' + (error ? " method-card--error" : "") + '">' +
      '<span class="badge-ic"><i class="ph-duotone ph-' + icon + '"></i></span>' +
      '<div class="col"><span class="m-title">' + title + '</span><span class="m-sub">' + sub + "</span></div>" +
    "</div>";

  const spinner = size =>
    '<span class="spin-logo" role="status" aria-label="Loading">' +
      '<svg viewBox="0 0 78 78" height="' + size + '" width="' + size + '" fill="var(--turquoise-600)">' +
        '<path d="M33.5925 33.7539L34.0941 33.7718L35.2255 19.3908H67.8167L70 0L12.159 0.00891428C12.159 0.00891428 10.9833 5.28171 10.6916 8.85188C9.4784 23.7432 18.9455 33.3194 33.5925 33.7539Z"></path>' +
        '<path d="M8.54363 66.3758L8 78H31.0644L32.9229 54.7137L50.9023 54.8006L53.205 34.5339H44.16C25.427 34.5339 9.20659 46.3587 8.54142 66.378L8.54363 66.3758Z"></path>' +
      "</svg></span>";

  // ── S2 · Classifying ────────────────────────────────────────────
  // Full screen, neutral copy: at this point we don't know which experience is coming.
  function classify(route, latency) {
    render("S2", "Classifying",
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:0 40px;text-align:center">' +
        spinner(56) +
        '<div style="display:flex;flex-direction:column;gap:8px">' +
          '<span style="font-size:20px;font-weight:600;letter-spacing:-.01em">Checking your payment</span>' +
          '<span style="font-size:15px;line-height:1.5;color:#877867">This takes a few seconds.</span>' +
        "</div>" +
      "</div>");
    const started = Date.now();
    if (latency >= CLASSIFY_TIMEOUT_MS) {
      // Degraded behaviour: capability never answered → E4 with the support CTA.
      later(() => { log("S2 timed out after 8 s — falling back to E4"); e4(); }, CLASSIFY_TIMEOUT_MS);
      return;
    }
    later(() => {
      const hold = Math.max(0, CLASSIFY_MIN_MS - (Date.now() - started));
      later(route, hold);
    }, latency);
  }

  // ── E1 · Retry ──────────────────────────────────────────────────
  function e1() {
    ctx.attempts >= RETRY_CAP ? e1b() : e1a();
  }

  function e1a() {
    render("E1-A", "Retry, initial",
      closeBar() +
      '<div class="hero">' +
        ill("sand-clock", 132) +
        "<h2>That didn’t go through</h2>" +
        "<p>Something went wrong on the way. No money moved and you weren’t charged. Try again in a moment.</p>" +
        methodCard("credit-card", ctx.method.title, fmt(ctx.amount) + " USD") +
      "</div>" +
      '<div class="footer">' +
        btn("Try again", "primary", "APP.retry()") +
        btn("Use another method", "ghost", "APP.picker('E1')") +
      "</div>");
  }

  function e1b() {
    render("E1-B", "Escalated — cap reached",
      closeBar() +
      '<div class="hero">' +
        ill("cards", 132) +
        "<h2>Still not going through</h2>" +
        "<p>We tried this card three times without luck. Another payment method usually fixes it.</p>" +
        methodCard("credit-card", ctx.method.title, ctx.attempts + " attempts") +
      "</div>" +
      '<div class="footer">' +
        btn("Use another method", "primary", "APP.picker('E1')") +
        btn("Try again", "ghost", "APP.retry()") +   // the cap is a nudge, not a lock
      "</div>");
  }

  // ── E2 · Another method only ────────────────────────────────────
  function e2() {
    render("E2", "Another method only",
      closeBar() +
      '<div class="hero">' +
        ill("hand-card-1", 132) +
        "<h2>This card can’t be used</h2>" +
        "<p>Your bank won’t accept it right now. Pick another payment method and we’ll continue from here — nothing else changes.</p>" +
        methodCard("credit-card", ctx.method.title, "Unavailable", true) +
      "</div>" +
      '<div class="footer">' +
        btn("Choose another method", "primary", "APP.picker('E2')") +
        btn("Cancel", "ghost", "APP.close()") +
      "</div>");
  }

  // ── S1 · Method picker (shared, E1 + E2) ────────────────────────
  function s1(from) {
    // Failed method stays visible but disabled; next available method pre-selected.
    const failedSub = from === "E2" ? "Unavailable right now" : "Didn’t go through";
    if (!ctx.selected) ctx.selected = ctx.methods.find(m => !m.failed).id;
    const rows = ctx.methods.map(m => {
      if (m.failed) {
        return '<div class="pick-row" data-disabled="true">' +
          '<span class="badge-ic"><i class="ph-duotone ph-' + m.icon + '"></i></span>' +
          '<div class="col" style="display:flex;flex-direction:column;gap:2px">' +
            '<span class="m-title" style="font-size:15px;font-weight:600">' + m.title + "</span>" +
            '<span class="m-sub" style="font-size:13px;color:#877867">' + failedSub + "</span>" +
          "</div></div>";
      }
      const sel = ctx.selected === m.id;
      return '<button class="pick-row" data-selected="' + sel + '" onclick="APP.select(\'' + m.id + "','" + from + "')\">" +
        '<span class="badge-ic"><i class="ph-duotone ph-' + m.icon + '"></i></span>' +
        '<div class="col" style="display:flex;flex-direction:column;gap:2px">' +
          '<span class="m-title" style="font-size:15px;font-weight:600">' + m.title + "</span>" +
          '<span class="m-sub" style="font-size:13px;color:#877867">' + m.sub + "</span>" +
        "</div>" +
        (sel ? '<span class="check"><i class="ph-bold ph-check"></i></span>' : "") +
      "</button>";
    }).join("");

    render("S1", "Method picker",
      '<div class="topbar"><button class="chip-btn" aria-label="Back" onclick="APP.back(\'' + from + '\')"><i class="ph ph-arrow-left"></i></button></div>' +
      '<div style="flex:1;display:flex;flex-direction:column;gap:16px;padding:8px 16px 0;overflow:hidden">' +
        '<div style="display:flex;flex-direction:column;gap:6px;padding:0 8px">' +
          '<h2 style="margin:0;font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.01em">Choose another method</h2>' +
          '<p style="margin:0;font-size:15px;line-height:1.5;color:#3f5a58">Your amount and recipient stay as they are.</p>' +
        "</div>" +
        '<div style="display:flex;flex-direction:column;gap:10px">' + rows +
          '<button class="pick-row" data-add="true" onclick="APP.exitTo(\'Add a new method\', \'Opens the add-method flow, then returns here with the new instrument selected.\')">' +
            '<span class="badge-ic"><i class="ph ph-plus"></i></span>' +
            '<span style="font-size:15px;font-weight:600">Add a new method</span>' +
          "</button>" +
        "</div>" +
      "</div>" +
      '<div style="padding:16px 16px 24px;flex-shrink:0">' + btn("Continue", "primary", "APP.confirmMethod()") + "</div>");
  }

  // ── E5 · Another amount ─────────────────────────────────────────
  function e5(limitShown) {
    const over = ctx.amount - ctx.available;
    const isOver = limitShown && over > 0;
    const chips = limitShown
      ? '<button class="amt-chip amt-chip--rec" onclick="APP.setAmount(' + ctx.available + ')">Send ' + fmt(ctx.available) + "</button>" +
        '<button class="amt-chip" onclick="APP.setAmount(300)">' + fmt(300) + "</button>"
      : '<button class="amt-chip amt-chip--rec" onclick="APP.setAmount(450)">Try ' + fmt(450) + "</button>" +
        '<button class="amt-chip" onclick="APP.setAmount(300)">' + fmt(300) + "</button>" +
        '<button class="amt-chip" onclick="APP.setAmount(150)">' + fmt(150) + "</button>";

    render(limitShown ? "E5-B" : "E5-A", limitShown ? "Another amount, limit shown" : "Another amount, default",
      closeBar() +
      '<div style="flex:1;display:flex;flex-direction:column;gap:20px;padding:24px 24px 0;min-height:0">' +
        '<div style="display:flex;justify-content:center">' + ill("calculator-coins", 112) + "</div>" +
        '<h2 style="margin:0;font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.01em;text-align:center">Try a different amount</h2>' +
        '<p style="margin:0;font-size:16px;line-height:1.5;color:#3f5a58;text-align:center;text-wrap:pretty">' +
          (limitShown
            ? "This amount is above what you can send right now. Adjust it and we’ll pick up right where you left off."
            : "This amount didn’t go through. Adjust it and we’ll pick up right where you left off.") +
        "</p>" +
        '<div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">' +
          '<div style="display:flex;align-items:baseline;justify-content:space-between">' +
            '<span style="font-size:14px;font-weight:500;color:#082422">Amount</span>' +
            (limitShown ? '<span style="font-size:13px;font-weight:500;color:#877867;font-variant-numeric:tabular-nums">Available now ' + fmt(ctx.available) + " USD</span>" : "") +
          "</div>" +
          '<div class="amount-box' + (isOver ? " amount-box--error" : "") + '">' +
            '<span style="font-size:30px;font-weight:700;color:' + (isOver ? "#a03808" : "#082422") + '">$</span>' +
            '<input id="amt" type="text" inputmode="decimal" value="' + ctx.amount.toFixed(2) + '" oninput="APP.amountInput(this.value)">' +
            '<span class="cur">USD</span>' +
          "</div>" +
          (isOver ? '<span style="font-size:13px;color:#a03808">' + fmt(over) + " USD over your available amount</span>" : "") +
          '<div style="display:flex;gap:8px;margin-top:4px">' + chips + "</div>" +
        "</div>" +
        (limitShown
          ? '<div style="margin-top:auto;margin-bottom:8px">' +
              '<div class="fx-alert fx-alert--info"><span class="fx-alert__icon"><i class="ph-duotone ph-info"></i></span>' +
              '<div class="fx-alert__body"><span class="fx-alert__title">More becomes available on Sep 1</span>' +
              '<span class="fx-alert__desc">Your limit resets at the start of each month.</span></div></div>' +
            "</div>"
          : "") +
      "</div>" +
      '<div class="footer">' +
        btn("Continue", "primary", "APP.confirmAmount()", isOver) +
        btn("Use another method", "ghost", "APP.picker('E5')") +
      "</div>");

    const input = document.getElementById("amt");
    if (input) { input.focus(); input.select(); }  // pre-filled, focused, selectable — never blank
  }

  // ── E3 · Step-up ────────────────────────────────────────────────
  function e3a() {
    render("E3-A", "Step-up offer",
      closeBar() +
      '<div class="hero">' +
        ill("lock", 132) +
        "<h2>Let’s confirm it’s you</h2>" +
        "<p>One quick security check and we’ll finish the payment. It takes less than a minute.</p>" +
        '<div class="method-card"><span class="badge-ic"><i class="ph-duotone ph-shield-check"></i></span>' +
          '<span style="font-size:14px;line-height:1.45;color:#3f5a58;text-align:left">Your money stays where it is until the check is done.</span></div>' +
      "</div>" +
      '<div class="footer">' +
        btn("Verify now", "primary", "APP.stepUpHost()") +
        btn("Cancel", "ghost", "APP.stepUpCancel()") +   // explicit exit → E4
      "</div>");
  }

  function e3b() {
    render("E3-B", "Step-up host — placeholder",
      '<div class="topbar topbar--split">' +
        '<button class="chip-btn" aria-label="Back" onclick="APP.stepUpCancel()"><i class="ph ph-arrow-left"></i></button>' +
        '<span class="title">Security check</span><span class="spacer"></span>' +
      "</div>" +
      '<div style="flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;min-height:0">' +
        '<div class="tbd-frame">' +
          '<span class="tbd-pill">TBD</span>' +
          '<span class="t-title">Provider surface goes here</span>' +
          '<span class="t-desc">3DS challenge, re-authentication or one-time code — whichever Fraud picks. Félix chrome stays; the inner frame is theirs.</span>' +
          '<div class="sim-row"><button class="sim-btn" onclick="APP.stepUpPass()">Simulate pass</button>' +
          '<button class="sim-btn" onclick="APP.stepUpFail()">Simulate fail</button></div>' +
        "</div>" +
        '<span style="font-size:13px;line-height:1.5;color:#877867;text-align:center">Don’t close this screen while the check is running.</span>' +
      "</div>" +
      '<div style="padding:16px 16px 24px;flex-shrink:0">' + btn("Cancel verification", "ghost", "APP.stepUpCancel()") + "</div>");
  }

  // ── E6 · KYC L2 ─────────────────────────────────────────────────
  function e6a() {
    const item = (icon, label) =>
      '<div class="kyc-item"><span class="ic"><i class="ph-duotone ph-' + icon + '"></i></span><span>' + label + "</span></div>";
    render("E6-A", "KYC L2 offer",
      closeBar() +
      '<div style="flex:1;display:flex;flex-direction:column;gap:20px;padding:24px 24px 0;min-height:0">' +
        '<div style="display:flex;justify-content:center">' + ill("passport", 120) + "</div>" +
        '<h2 style="margin:0;font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.01em;text-align:center">Verify your identity to continue</h2>' +
        '<p style="margin:0;font-size:16px;line-height:1.5;color:#3f5a58;text-align:center;text-wrap:pretty">We need a little more information before this payment can go through. You’ll only do this once.</p>' +
        '<div style="display:flex;flex-direction:column;gap:12px;margin-top:4px">' +
          item("identification-card", "A photo of your ID") +
          item("user-focus", "A quick selfie") +
          item("timer", "About 3 minutes") +
        "</div>" +
      "</div>" +
      '<div class="footer">' +
        btn("Verify my identity", "primary", "APP.kycStart()") +
        btn("Not now", "ghost", "APP.kycDefer()") +   // saves the payment as a draft
      "</div>");
  }

  function e6b() {
    render("E6-B", "L2 capture — placeholder",
      '<div class="topbar topbar--split">' +
        '<button class="chip-btn" aria-label="Back" onclick="APP.kycLeave()"><i class="ph ph-arrow-left"></i></button>' +
        '<span class="title">Step ' + ctx.kycStep + ' of 3</span><span class="spacer"></span>' +
      "</div>" +
      '<div style="padding:0 16px 8px"><div class="fx-progress fx-progress--md"><div class="fx-progress__bar" style="width:' + Math.round(ctx.kycStep / 3 * 100) + '%"></div></div></div>' +
      '<div style="flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;min-height:0">' +
        '<div class="tbd-frame">' +
          '<span class="tbd-pill">TBD</span>' +
          '<span class="t-title">Identity’s capture flow</span>' +
          '<span class="t-desc">ID front and back, then selfie. Owned by Identity — this surface only fixes the entry, the progress chrome and the two exits.</span>' +
          '<div class="sim-row"><button class="sim-btn" onclick="APP.kycFail()">Simulate failure</button></div>' +
        "</div>" +
      "</div>" +
      '<div style="padding:16px 16px 24px;flex-shrink:0">' + btn("Continue", "primary", "APP.kycNext()") + "</div>");
  }

  function e6c() {
    render("E6-C", "Verified — retry unlocked",
      '<div style="height:48px;flex-shrink:0"></div>' +
      '<div class="hero" style="padding-top:40px">' +
        ill("party-popper", 132) +
        "<h2>You’re all set</h2>" +
        "<p>Your identity is confirmed. Your payment is ready to go, exactly as you left it.</p>" +
        '<div class="summary">' +
          '<div class="row"><span class="k">Amount</span><span class="v">' + fmt(ctx.amount) + " USD</span></div>" +
          '<div class="row"><span class="k">Method</span><span class="v">' + ctx.method.title + "</span></div>" +
        "</div>" +
      "</div>" +
      '<div class="footer">' +
        btn("Try again", "primary", "APP.kycRetry()") +
        btn("Not now", "ghost", "APP.kycDefer()") +
      "</div>");
  }

  function e6d() {
    render("E6-D", "Verification failed or left",
      closeBar() +
      '<div class="hero">' +
        ill("attention", 126) +
        "<h2>We couldn’t verify you yet</h2>" +
        "<p>Your payment is saved. You can pick the verification back up whenever you’re ready, or write to us on WhatsApp.</p>" +
      "</div>" +
      '<div class="footer">' +
        btn("Try verifying again", "primary", "APP.kycStart()") +
        btn("Message us on WhatsApp", "ghost", "APP.whatsapp()") +
      "</div>");
  }

  // ── E4 · Final decision (and the catch-all) ─────────────────────
  function e4() {
    render("E4", "Final decision",
      closeBar() +
      '<div class="hero">' +
        ill("headphones", 126) +
        "<h2>We couldn’t complete this payment</h2>" +
        "<p>Nothing was charged. Our team on WhatsApp can look into it with you.</p>" +
        '<div class="ref-pill"><span class="k">Reference</span><span class="v">8F3K-2201</span></div>' +
      "</div>" +
      '<div class="footer">' +
        btn("Message us on WhatsApp", "primary", "APP.whatsapp()") +
        btn("Done", "ghost", "APP.close()") +
      "</div>");
  }

  // ── Routing ─────────────────────────────────────────────────────
  function routeScenario() {
    switch (ctx.scenario) {
      case "transient": return e1();
      case "hard":      return e2();
      case "stepup":    return e3a();
      case "terminal":  return e4();
      case "amount":    return e5(false);
      case "limit":     return e5(true);
      case "kyc":       return e6a();
    }
  }

  // ── Public actions ──────────────────────────────────────────────
  window.APP = {
    start(id) {
      ctx.scenario = id;
      ctx.amount = 600; ctx.available = 450; ctx.attempts = 0; ctx.kycStep = 1;
      ctx.methods.forEach(m => m.failed = m.id === "visa");
      ctx.method = ctx.methods[0]; ctx.selected = null;
      document.querySelectorAll(".scenario").forEach(b => b.dataset.active = b.dataset.id === id);
      if (id === "timeout") { classify(null, CLASSIFY_TIMEOUT_MS); return; }
      if (id === "transient") ctx.attempts = 1;  // the first failed attempt brought us here
      classify(routeScenario, 900);
    },

    home() { clearTimers(); setState("", ""); phone.innerHTML = ""; document.querySelectorAll(".scenario").forEach(b => b.dataset.active = "false"); },
    close() { exit("Flow dismissed", "Returns to wherever the payment was started from. The draft is kept."); },
    whatsapp() { exit("WhatsApp support", "Opens wa.me with the reference pre-filled. Agents see the decline reason; the user never does."); },
    exitTo(t, d) { exit(t, d); },

    // E1
    retry() {
      ctx.attempts++;
      log("Retry attempt " + ctx.attempts + " with " + ctx.method.title);
      classify(e1, 900); // transient declines keep failing in this demo
    },

    // S1
    picker(from) { ctx.selected = null; s1(from); },
    select(id, from) { ctx.selected = id; s1(from); },
    back(from) { from === "E2" ? e2() : from === "E5" ? e5(ctx.scenario === "limit") : e1(); },
    confirmMethod() {
      const m = ctx.methods.find(x => x.id === ctx.selected);
      ctx.method = m;
      ctx.attempts = 0; // counter resets on method change (TBD assumption, documented)
      exit("Back at review", "Method switched to " + m.title + ". Amount and recipient unchanged — the flow was never restarted.");
    },

    // E5
    setAmount(v) { ctx.amount = v; e5(ctx.scenario === "limit"); },
    amountInput(v) {
      const n = parseFloat(v.replace(/[^0-9.]/g, ""));
      if (!isNaN(n)) ctx.amount = n;
      if (ctx.scenario === "limit") {
        // live re-validate without re-rendering the whole screen
        const over = ctx.amount - ctx.available;
        const box = document.querySelector(".amount-box");
        const cta = document.querySelector(".footer .fx-btn--primary");
        if (box && cta) {
          box.classList.toggle("amount-box--error", over > 0);
          box.querySelector("input").style.color = over > 0 ? "#a03808" : "#082422";
          cta.disabled = over > 0;
        }
      }
    },
    confirmAmount() {
      exit("Back at review", "Amount updated to " + fmt(ctx.amount) + " USD. Fees recalculate at review (TBD: before or after the retry).");
    },

    // E3
    stepUpHost() { e3b(); },
    stepUpPass() { log("Step-up passed — payment resumes automatically"); exit("Payment resumed", "The check passed. The original payment continues automatically — no extra confirmation screen."); },
    stepUpFail() { log("Step-up failed — no explanation of what failed"); e4(); },
    stepUpCancel() { log("Step-up cancelled or abandoned"); e4(); },

    // E6
    kycStart() { ctx.kycStep = 1; e6b(); },
    kycNext() { ctx.kycStep >= 3 ? e6c() : (ctx.kycStep++, e6b()); },
    kycLeave() { log("Left the capture flow"); e6d(); },
    kycFail() { log("Identity rejected the documents"); e6d(); },
    kycDefer() { exit("Payment saved as a draft", "The verification offer can be picked up later from the draft."); },
    kycRetry() { classify(() => exit("Payment resumed", "Identity confirmed — the retry goes straight back through review."), 900); },
  };

  // ── Boot ────────────────────────────────────────────────────────
  const scen = document.getElementById("scenarios");
  SCENARIOS.forEach(s => {
    const b = document.createElement("button");
    b.className = "scenario";
    b.dataset.id = s.id;
    b.innerHTML = '<span class="code">' + s.code + "</span><span>" + s.label + "</span>";
    b.onclick = () => APP.start(s.id);
    scen.appendChild(b);
  });
  APP.start("transient");
})();
</script>
</body>
</html>
